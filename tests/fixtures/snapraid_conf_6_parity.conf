# Maximum 6-parity SnapRAID config for testing
parity /mnt/parity1/snapraid.parity
2-parity /mnt/parity2/snapraid.2-parity
3-parity /mnt/parity3/snapraid.3-parity
4-parity /mnt/parity4/snapraid.4-parity
5-parity /mnt/parity5/snapraid.5-parity
6-parity /mnt/parity6/snapraid.6-parity

content /mnt/disk1/.snapraid.content
content /mnt/disk2/.snapraid.content
content /var/snapraid.content

data d1 /mnt/disk1
data d2 /mnt/disk2
