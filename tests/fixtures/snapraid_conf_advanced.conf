# Advanced SnapRAID configuration fixture for test suite
; Semicolon comments should be ignored
# Hash comments should be ignored

parity /mnt/parity1/snapraid.parity
2-parity /mnt/parity2/snapraid.2-parity
3-parity /mnt/parity3a/snapraid.3-parity, /mnt/parity3b/snapraid.3-parity
